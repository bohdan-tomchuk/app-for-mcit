# Prod-подібний запуск лише з Docker: docker compose -f compose.run.yaml up --build
# Sail (compose.yaml) призначений для розробки й не зачіпається.
name: tickets-panel-run
services:
    app:
        build: .
        ports:
            - '8080:8080'
        environment:
            APP_NAME: 'Панель заявок'
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: http://localhost:8080
            APP_LOCALE: uk
            APP_FALLBACK_LOCALE: en
            # Демонстраційний ключ, не для реального продакшну.
            APP_KEY: 'base64:hw55Xf2//YZphY7pz93ShcrIr/KrPlNbBFzqrQePYdU='
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: laravel
            DB_USERNAME: laravel
            DB_PASSWORD: secret
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        depends_on:
            pgsql:
                condition: service_healthy
    pgsql:
        image: 'postgres:18-alpine'
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
            POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8'
        volumes:
            - 'run-pgsql:/var/lib/postgresql'
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', 'laravel', '-U', 'laravel']
            interval: 3s
            retries: 20
            timeout: 5s
volumes:
    run-pgsql:
